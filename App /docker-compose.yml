name: schedule-app

services:
  api-server:
    container_name: api-server
    image: api-server
    ports:
      - "3000:3000"
    networks:
      - mern-app
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/schedule
  react-app:
    image: react-app
    stdin_open: true
    ports: 
      - "8000:8000"
    networks:
      - mern-app
  mongo:
     container_name: mongodb
     image: mongo:4.0
     ports:
      - "27017:27017"
     networks:
      - mern-app
     volumes:
      - mongo-data:/data/db
networks:
  mern-app:
    driver: bridge
volumes:
  mongo-data:
    driver: local

  
  
    
  